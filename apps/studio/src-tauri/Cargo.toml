[package]
name = "wondershine-studio"
version = "0.2.0"
description = "WonderShine Creator Studio"
authors = ["WonderShine contributors"]
edition = "2021"

[lib]
name = "wondershine_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-keyring-store = { version = "=0.3.2", default-features = false }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.14.1"
semver = "1"
tauri-plugin-single-instance = "2"
tauri-plugin-persisted-scope = { version = "2", features = ["protocol-asset"] }

[features]
default = []
native-smoke = []
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
urlpattern = "0.6"
regex = "1"

[workspace]
members = ["mobile-git", "android-updater"]
resolver = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
studio-mobile-git = { path = "mobile-git" }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-studio-apk = { path = "android-updater" }
