[package]
name = "studio-mobile-git"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"

[dependencies]
git2 = { version = "=0.20.4", default-features = false, features = ["https", "vendored-libgit2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
url = "2"
regex = "1"
sha2 = "0.10"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
git2 = { version = "=0.20.4", default-features = false, features = ["vendored-openssl"] }
