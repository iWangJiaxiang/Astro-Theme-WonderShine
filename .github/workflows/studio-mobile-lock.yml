name: Resolve Studio mobile dependency metadata
on:
  push:
    branches: [feat/studio-libgit2-mobile]
    paths: [.github/workflows/studio-mobile-lock.yml]
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo update -p wondershine-studio --manifest-path apps/studio/src-tauri/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: resolved-lock
          path: apps/studio/src-tauri/Cargo.lock
