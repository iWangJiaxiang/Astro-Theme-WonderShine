name: Studio targeted UI diagnostics
run-name: Studio UI complements and gesture diagnostics · ${{ github.ref_name }}
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/studio/tests/browser/gesture-diagnostics.mjs'
      - '.github/workflows/studio-ui-targeted.yml'
permissions:
  contents: read
concurrency:
  group: studio-ui-targeted-${{ github.ref }}
  cancel-in-progress: true
jobs:
  complements:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies (remote only)
        run: npm ci
      - name: Build Studio service
        id: service
        run: npm run studio:build
      - uses: browser-actions/setup-chrome@v2.2.0
        id: chrome
      - name: Enable Chromium sandbox namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install multilingual screenshot fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji
      - name: Minimal synthetic versus dispatched touch diagnostic
        timeout-minutes: 6
        run: npx --no-install tsx apps/studio/tests/browser/gesture-diagnostics.mjs
        env:
          STUDIO_TEST_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
      - name: Root modal and navigation safety regression
        if: ${{ !cancelled() && steps.service.outcome == 'success' && steps.chrome.outcome == 'success' }}
        timeout-minutes: 5
        run: npx --no-install tsx apps/studio/tests/browser/root-modals-runner.mjs
        env:
          STUDIO_TEST_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
      - name: Build mocked-native fixture independently of prior findings
        id: native
        if: ${{ !cancelled() && steps.service.outcome == 'success' && steps.chrome.outcome == 'success' }}
        run: npm run build:app -w @wondershine/studio
        env:
          VITE_STUDIO_GITHUB_CLIENT_ID: studio-ci-github
          VITE_STUDIO_CNB_CLIENT_ID: studio-ci-cnb
      - name: Mocked-native business and gesture complement
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        timeout-minutes: 15
        run: node apps/studio/tests/browser/native-ui.mjs
        env:
          STUDIO_TEST_GESTURES: 'true'
          STUDIO_TEST_OAUTH: fixture
          STUDIO_TEST_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
      - name: Retain all targeted evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: studio-targeted-ui-${{ github.run_attempt }}
          path: apps/studio/test-results/
          if-no-files-found: warn
          retention-days: 7
