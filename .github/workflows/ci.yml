name: Verify theme and Studio
on:
  push:
    paths-ignore: &theme_ignore
      - 'apps/studio/**'
      - 'docs/**'
      - 'plan/**'
      - '.github/workflows/studio.yml'
  pull_request:
    paths-ignore: *theme_ignore
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:starter
      - run: npm run check
      - run: npm test
      - run: npm run test:integration
      - run: npm run studio:build
      - run: npm run audit:distribution
      - run: npm run test:package
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Enable Chromium sandbox namespaces on the ephemeral runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run test:browser
        env:
          STUDIO_TEST_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run test:browser -w @wondershine/studio
        env:
          STUDIO_TEST_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theme-browser-results
          path: |
            temp/browser/
            apps/studio/test-results/
