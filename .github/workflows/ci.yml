name: Verify theme and Studio
on:
  workflow_dispatch:
  push:
    paths-ignore: &theme_ignore
      - 'apps/studio/**'
      - 'docs/**'
      - 'plan/**'
      - '.github/workflows/studio.yml'
  pull_request:
    paths-ignore: *theme_ignore
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Reuse responsive image encodings
        uses: actions/cache@v6.1.0
        with:
          path: .astro/image-cache
          key: ${{ runner.os }}-theme-images-v1-${{ hashFiles('package-lock.json', 'packages/theme/scripts/responsive-images.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-theme-images-v1-${{ hashFiles('package-lock.json', 'packages/theme/scripts/responsive-images.ts') }}-
      - run: npm run build
        env:
          ASTRO_IMAGE_CACHE_DIR: ${{ github.workspace }}/.astro/image-cache
      - run: npm run build:starter
        env:
          ASTRO_IMAGE_CACHE_DIR: ${{ github.workspace }}/.astro/image-cache
      - run: npm run check
      - run: npm test
      - run: node --test tests/npm-release.test.mjs
      - run: npm run test:integration
      - run: npm run studio:build
      - run: npm run audit:distribution
      - run: npm run test:package
        env:
          ASTRO_IMAGE_CACHE_DIR: ${{ github.workspace }}/.astro/image-cache
      - uses: browser-actions/setup-chrome@v2.2.0
        id: chrome
      - name: Enable Chromium sandbox namespaces on the ephemeral runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install fonts for multilingual browser screenshots
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji
      - run: npm run test:browser
        env:
          STUDIO_TEST_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run test:browser -w @wondershine/studio
        env:
          STUDIO_TEST_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: theme-browser-results
          path: |
            temp/browser/
            apps/studio/test-results/
