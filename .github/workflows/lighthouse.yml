name: Lighthouse preview audit
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device: [mobile, desktop]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Prepare sandbox and multilingual fonts
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji
      - name: Audit production preview (three cold runs per page)
        run: node scripts/lighthouse-audit.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          AUDIT_DEVICE: ${{ matrix.device }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-${{ matrix.device }}
          path: temp/lighthouse/${{ matrix.device }}/
          retention-days: 14
