name: Lighthouse preview audit
on:
  workflow_dispatch:
    inputs:
      deployed_url:
        description: 'Optional public HTTPS page to audit instead of the demo preview'
        type: string
        required: false
      compare_umami:
        description: 'Compare demo analytics on/off for home, threads and timeline'
        type: boolean
        default: false
      report_run_id:
        description: 'Optional completed run ID: read existing summaries without rerunning audits'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: lighthouse-${{ github.ref }}-${{ inputs.report_run_id || 'audit' }}
  cancel-in-progress: true
jobs:
  report:
    if: inputs.report_run_id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.report_run_id }}
          pattern: lighthouse-*
          path: reports
      - name: Read existing summaries
        run: |
          for file in reports/lighthouse-*/summary.json; do cat "$file"; done
          for file in reports/lighthouse-*/summary.md; do cat "$file" >> "$GITHUB_STEP_SUMMARY"; done
      - name: Read representative performance diagnostics
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync, readdirSync} from 'node:fs';
          for (const folder of readdirSync('reports')) {
            const summary = JSON.parse(readFileSync(`reports/${folder}/summary.json`, 'utf8'));
            for (const result of summary.results) {
              const report = JSON.parse(readFileSync(`reports/${folder}/${result.representative.file.replace('.html', '.json')}`, 'utf8'));
              const ids = ['lcp-breakdown-insight', 'lcp-discovery-insight', 'layout-shifts', 'bootup-time', 'final-screenshot'];
              console.log(JSON.stringify({device: summary.device, page: result.name, diagnostics: Object.fromEntries(ids.map(id => [id, report.audits[id]]))}));
            }
          }
          NODE
  audit:
    if: inputs.report_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device: [mobile, desktop]
        analytics: ${{ fromJSON(inputs.compare_umami && inputs.deployed_url == '' && '["off","on"]' || '["default"]') }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        if: inputs.deployed_url == ''
      - name: Reuse responsive image encodings
        if: inputs.deployed_url == ''
        uses: actions/cache@v6.1.0
        with:
          path: .astro/image-cache
          key: ${{ runner.os }}-theme-images-v1-${{ hashFiles('package-lock.json', 'packages/theme/scripts/responsive-images.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-theme-images-v1-${{ hashFiles('package-lock.json', 'packages/theme/scripts/responsive-images.ts') }}-
      - name: Enable the loopback Umami fixture
        if: matrix.analytics == 'on'
        run: |
          cat >> examples/demo/config.toml <<'EOF'

          [extra.site.analytics.umami]
          enable = true
          js = "http://127.0.0.1:4400/script.js"
          id = "11111111-2222-4333-8444-555555555555"
          EOF
      - run: npm run build
        if: inputs.deployed_url == ''
        env:
          ASTRO_IMAGE_CACHE_DIR: ${{ github.workspace }}/.astro/image-cache
      - uses: browser-actions/setup-chrome@v2.2.0
        id: chrome
      - name: Enable Chromium sandbox namespaces on the ephemeral runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: ./.github/actions/browser-fonts
      - name: Audit page (three cold runs per page)
        run: node scripts/lighthouse-audit.mjs
        env:
          AUDIT_ANALYTICS: ${{ matrix.analytics }}
          AUDIT_URL: ${{ inputs.deployed_url }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          AUDIT_DEVICE: ${{ matrix.device }}
      - name: Publish score summary
        if: success()
        run: cat "temp/lighthouse/$AUDIT_DEVICE/summary.md" >> "$GITHUB_STEP_SUMMARY"
        env:
          AUDIT_DEVICE: ${{ matrix.device }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: lighthouse-${{ matrix.device }}${{ matrix.analytics != 'default' && format('-{0}', matrix.analytics) || '' }}
          path: temp/lighthouse/${{ matrix.device }}/
          retention-days: 14
