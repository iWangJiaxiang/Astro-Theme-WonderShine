name: Theme npm package
run-name: Theme npm · ${{ github.event.release.tag_name || github.event.client_payload.version || (github.event_name == 'push' && 'prepare canary') || 'dry run' }}
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/theme/**'
      - '!packages/theme/tests/**'
      - '!packages/theme/**/*.md'
      - 'scripts/build-theme.mjs'
      - 'package.json'
      - 'package-lock.json'
  repository_dispatch:
    types: [theme-canary]
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: theme-npm-${{ github.event_name }}-${{ github.event.release.tag_name || github.ref }}
  queue: max
  cancel-in-progress: false
env:
  NPM_CLI_VERSION: '11.21.1'
jobs:
  prepare-canary:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Commit the canary version on main
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          read_version() { git show "$1:packages/theme/package.json" | jq -er .version; }
          current=$(read_version HEAD)
          previous=$(read_version "$BEFORE")
          # A release bump already selects its channel. Only canaries publish automatically.
          if [[ "$current" != "$previous" && "$current" != *-canary.* ]]; then exit 0; fi
          if [[ "$current" == "$previous" ]]; then
            # Studio dependency updates may also touch the shared lockfile.
            mapfile -t changed < <(git diff --name-only "$BEFORE" HEAD)
            if printf '%s\n' "${changed[@]}" | grep -q '^apps/studio/' &&
               ! printf '%s\n' "${changed[@]}" | grep -Eq '^(packages/theme/|scripts/build-theme\.mjs$|package\.json$)'; then exit 0; fi
          fi
          expected=$(node --input-type=module -e 'import { nextCanary } from "./scripts/theme-version.mjs"; console.log(nextCanary(process.argv[1], process.env.GITHUB_RUN_ID))' "$current")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
            git switch --detach origin/main
            head_version=$(read_version HEAD)
            if [[ "$current" == "$previous" && "$head_version" == "$expected" ]]; then
              version=$expected
              break
            fi
            if [[ "$head_version" != "$current" ]]; then exit 0; fi
            if [[ "$current" != "$previous" ]]; then
              version=$current
              break
            fi
            version=$(node scripts/theme-version.mjs --canary)
            git add packages/theme/package.json examples/{demo,starter}/package.json package-lock.json
            git commit -m "chore(theme): prepare $version"
            if git push origin HEAD:main; then break; fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Queue verification of the committed version
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh api "repos/$GITHUB_REPOSITORY/dispatches" -f event_type=theme-canary -F "client_payload[version]=$VERSION"
  verify:
    if: github.event_name != 'push' && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'theme-v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      publish: ${{ steps.context.outputs.publish }}
      version: ${{ steps.context.outputs.version }}
      dist-tag: ${{ steps.context.outputs.distTag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Use an OIDC-capable npm CLI
        run: npm install --global "npm@$NPM_CLI_VERSION" --ignore-scripts
      - name: Validate release source and version
        id: context
        run: node scripts/npm-release.mjs
      - name: Check that the release commit belongs to main
        if: github.event_name == 'release'
        run: |
          git fetch --no-tags --unshallow origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm ci
      - name: Reuse responsive image encodings
        uses: actions/cache@v6.1.0
        with:
          path: .astro/image-cache
          key: ${{ runner.os }}-theme-images-v1-${{ hashFiles('package-lock.json', 'packages/theme/scripts/responsive-images.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-theme-images-v1-${{ hashFiles('package-lock.json', 'packages/theme/scripts/responsive-images.ts') }}-
      - run: node --test tests/npm-release.test.mjs
      - run: npm run build
        env:
          ASTRO_IMAGE_CACHE_DIR: ${{ github.workspace }}/.astro/image-cache
      - run: npm run build:starter
        env:
          ASTRO_IMAGE_CACHE_DIR: ${{ github.workspace }}/.astro/image-cache
      - run: npm run check
      - run: npm test
      - run: npm run test:integration
      - run: npm run audit:distribution
      - name: Pack and verify an isolated consumer installation
        run: npm run test:package
        env:
          ASTRO_IMAGE_CACHE_DIR: ${{ github.workspace }}/.astro/image-cache
      - name: Preserve the tested archive
        id: artifact
        run: node scripts/npm-artifact.mjs prepare
        env:
          THEME_VERSION: ${{ steps.context.outputs.version }}
      - name: Validate publication without uploading
        run: npm publish "$PACKAGE_ARCHIVE" --dry-run --ignore-scripts --access public --tag "$DIST_TAG"
        env:
          PACKAGE_ARCHIVE: ${{ steps.artifact.outputs.archive }}
          DIST_TAG: ${{ steps.context.outputs.distTag }}
      - uses: browser-actions/setup-chrome@v2.2.0
        id: chrome
      - name: Enable Chromium sandbox namespaces on the ephemeral runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: ./.github/actions/browser-fonts
      - run: npm run test:browser
        env:
          STUDIO_TEST_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: theme-npm-package
          path: temp/npm-release/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: theme-npm-browser-results
          path: temp/browser/
          retention-days: 7
  publish:
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    concurrency:
      group: theme-npm-publish-${{ needs.verify.outputs.dist-tag }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm install --global "npm@$NPM_CLI_VERSION" --ignore-scripts
      - uses: actions/download-artifact@v8.0.2
        with:
          name: theme-npm-package
          path: temp/npm-release
      - name: Verify the tested archive and its source
        id: artifact
        run: node scripts/npm-artifact.mjs verify
        env:
          THEME_VERSION: ${{ needs.verify.outputs.version }}
      - name: Publish with npm trusted publishing
        run: |
          tags=$(npm view @wondershine/theme dist-tags --json)
          current=$(jq -r --arg tag "$DIST_TAG" '.[$tag] // empty' <<<"$tags")
          if [[ "$current" == "$THEME_VERSION" ]]; then
            integrity=$(npm view "@wondershine/theme@$THEME_VERSION" dist.integrity)
            test "$integrity" = "sha512-$(openssl dgst -sha512 -binary "$PACKAGE_ARCHIVE" | openssl base64 -A)"
            exit 0
          fi
          if [[ -n "$current" ]]; then
            printf '%s\n' "$current" "$THEME_VERSION" | LC_ALL=C sort -V -C
          fi
          npm publish "$PACKAGE_ARCHIVE" --ignore-scripts --access public --tag "$DIST_TAG"
        env:
          PACKAGE_ARCHIVE: ${{ steps.artifact.outputs.archive }}
          DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
          THEME_VERSION: ${{ needs.verify.outputs.version }}
